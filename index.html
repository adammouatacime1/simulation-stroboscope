      name="description"
      content="Explorez la rotation réelle et le mouvement apparent d’un disque éclairé par un stroboscope. Une simulation scientifique interactive."
    />
    <title>Stroboscope Lab — Explorez le mouvement</title>
    <script>
      try {
        const saved = localStorage.getItem("stroboscope-theme");
        document.documentElement.dataset.theme =
          saved === "light" || saved === "dark"
            ? saved
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
      } catch {
        document.documentElement.dataset.theme = matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches
          ? "dark"
          : "light";
      }
    </script>
